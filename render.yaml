# Despliega el backend Python en Render (transcripción gratis, sin créditos OpenAI)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: verificacol-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: WHISPER_MODEL
        value: tiny
      - key: USE_FASTER_WHISPER
        value: "true"
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: ALLOWED_ORIGINS
        value: https://verificacol.vercel.app
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      # Agregar manualmente en Render Dashboard:
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, WORKER_SECRET
